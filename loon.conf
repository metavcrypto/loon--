[General]
dns-server = system
mitm-on-start = true

[Proxy]

[Proxy Group]
PROXY = select, DIRECT

[Rule]
# ===== ① Copilot / AI（优先走代理）=====
DOMAIN-SUFFIX,copilot.microsoft.com,PROXY
DOMAIN-SUFFIX,bing.com,PROXY
DOMAIN-SUFFIX,edgeservices.bing.com,PROXY
DOMAIN-SUFFIX,edge.microsoft.com,PROXY
DOMAIN-SUFFIX,azureedge.net,PROXY
DOMAIN-SUFFIX,msftcloudes.com,PROXY
DOMAIN-KEYWORD,copilot,PROXY
DOMAIN-KEYWORD,bing,PROXY

# ===== ② Microsoft 主服务（直连）=====
DOMAIN-SUFFIX,microsoft.com,DIRECT
DOMAIN-SUFFIX,office.com,DIRECT
DOMAIN-SUFFIX,live.com,DIRECT
DOMAIN-SUFFIX,outlook.com,DIRECT
DOMAIN-SUFFIX,onedrive.com,DIRECT
DOMAIN-SUFFIX,sharepoint.com,DIRECT
DOMAIN-SUFFIX,msauth.net,DIRECT
DOMAIN-SUFFIX,msauthimages.net,DIRECT
DOMAIN-SUFFIX,msftauth.net,DIRECT
DOMAIN-SUFFIX,msftauthimages.net,DIRECT

# ===== ③ Apple（建议直连，避免异常）=====
DOMAIN-SUFFIX,apple.com,DIRECT
DOMAIN-SUFFIX,icloud.com,DIRECT
DOMAIN-SUFFIX,itunes.apple.com,DIRECT

# ===== ④ 局域网 / 内网 =====
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT

# ===== ⑤ 兜底 =====
FINAL,PROXY
